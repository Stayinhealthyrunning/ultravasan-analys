name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installera Python-beroenden
        run: python -m pip install -r requirements-test.txt

      - name: Verifiera aktiv golden master
        shell: bash
        run: |
          set -euo pipefail
          if [ -f reports/U2_BASELINE.json ]; then
            python tools/u2_baseline.py --check
          else
            python tools/u0_baseline.py --check
          fi

      - name: Verifiera loppkontrakt och publicerade banversioner
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/race_contracts.py --check --base-ref "$CONTRACT_BASE_REF"

      - name: Verifiera U3 modulär webbdata mot monoliten
        shell: bash
        run: |
          set -euo pipefail
          python tools/u3_modularize.py \
            --source docs/data/ultravasan.json \
            --output-dir "$RUNNER_TEMP/u3-data" \
            --write --check \
            --report "$RUNNER_TEMP/u3-modular-report.json"

      - name: Verifiera U9 release freeze
        run: |
          python tools/u9_release_audit.py \
            --modular-report "$RUNNER_TEMP/u3-modular-report.json" \
            --json-output "$RUNNER_TEMP/u9-release-audit.json"

      - name: Audita U2 legacy-identiteter read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f reports/U2_BASELINE.json ]; then
            python tools/u2_identity_audit.py --expect-u0-audit --report "$RUNNER_TEMP/u2-identity-audit.json"
          else
            echo "U2-baseline finns; legacy-auditen är historisk."
          fi

      - name: Provkör U2-identitetsmigration på databaskopia
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f reports/U2_BASELINE.json ]; then
            python tools/u2_identity_migration.py \
              --copy-from data/ultravasan.sqlite \
              --db "$RUNNER_TEMP/u2-migrated.sqlite" \
              --apply \
              --confirm MIGRATE-U2-IDENTITY \
              --report "$RUNNER_TEMP/u2-identity-migration.json"
            python tools/uvtool.py --db "$RUNNER_TEMP/u2-migrated.sqlite" export \
              --output "$RUNNER_TEMP/u2-web.json" \
              --js-output "$RUNNER_TEMP/u2-web.js"
            python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import u2_baseline

          temp = Path(__import__("os").environ["RUNNER_TEMP"])
          snapshot = u2_baseline.build_snapshot(
              db=temp / "u2-migrated.sqlite",
              web_json=temp / "u2-web.json",
              web_js=temp / "u2-web.js",
              manifest=temp / "manifest.json",
          )
          issues = u2_baseline.validate_snapshot(snapshot)
          if issues:
              raise SystemExit("Migrated web export failed U2 validation:\n- " + "\n- ".join(issues))
          print(
              "Migrated web export verified:",
              snapshot["web_export"]["results"],
              "results,",
              snapshot["web_export"]["person_key_rows"],
              "person-key result rows.",
          )
          PY
          else
            python tools/u2_identity_migration.py --db data/ultravasan.sqlite
          fi

      - name: Kör Python-tester
        run: python -m pytest -q

      - name: Kontrollera JavaScript-syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find docs/assets tests tools -type f \( -name "*.js" -o -name "*.mjs" \) | sort)

      - name: Kör JavaScript-tester
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node "$file"
          done < <(find tests -maxdepth 1 -type f -name "test_*.js" | sort)

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installera Chromium
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Förbered U3 modulär browserdata
        shell: bash
        run: |
          set -euo pipefail
          python tools/u3_modularize.py \
            --source docs/data/ultravasan.json \
            --output-dir docs/data \
            --write --check \
            --report "$RUNNER_TEMP/u3-browser-data.json"

      - name: Kör verkligt browserflöde
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory docs >"$RUNNER_TEMP/ultravasan-http.log" 2>&1 &
          browser_path="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          "$browser_path" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --remote-debugging-port=9223 \
            --user-data-dir="$RUNNER_TEMP/ultravasan-chromium" \
            http://127.0.0.1:8765/ >"$RUNNER_TEMP/ultravasan-browser.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null
          node tools/verify_local_browser.mjs
          python tools/verify_playwright_e2e.py --base-url http://127.0.0.1:8765/
