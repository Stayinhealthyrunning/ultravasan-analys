name: Temporary route source research

on:
  push:
    branches:
      - feature/year-specific-gpx-routes

permissions:
  contents: read

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/year-specific-gpx-routes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research public route sources and compare official KMZ
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, math, re, hashlib, html as htmlmod, urllib.request, urllib.error, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from urllib.parse import urljoin, urlparse

          ROOT = Path(".")
          OUT = Path("tmp/route-source-research")
          OUT.mkdir(parents=True, exist_ok=True)
          UA = "Mozilla/5.0 (compatible; UltravasanRouteAudit/1.0; +https://github.com/Stayinhealthyrunning/ultravasan-analys)"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      return {"url": url, "status": int(r.status), "content_type": r.headers.get("Content-Type",""), "final_url": r.geturl(), "body": body}
              except urllib.error.HTTPError as e:
                  return {"url": url, "status": int(e.code), "content_type": e.headers.get("Content-Type","") if e.headers else "", "final_url": url, "error": str(e), "body": e.read() if hasattr(e,"read") else b""}
              except Exception as e:
                  return {"url": url, "status": None, "content_type": "", "final_url": url, "error": repr(e), "body": b""}

          def parse_gpx(path):
              root = ET.parse(path).getroot()
              pts=[]
              for el in root.iter():
                  if el.tag.endswith("trkpt"):
                      lat=float(el.attrib["lat"]); lon=float(el.attrib["lon"]); ele=None
                      for ch in el:
                          if ch.tag.endswith("ele") and ch.text:
                              try: ele=float(ch.text)
                              except: pass
                      pts.append((lat,lon,ele))
              return pts

          def parse_kmz(path):
              pts=[]
              with zipfile.ZipFile(path) as z:
                  kml_names=[n for n in z.namelist() if n.lower().endswith(".kml")]
                  if not kml_names: return pts
                  root=ET.fromstring(z.read(kml_names[0]))
                  # Standard KML coordinates: lon,lat[,alt]
                  for el in root.iter():
                      if el.tag.endswith("coordinates") and el.text:
                          for token in el.text.replace("\n"," ").replace("\t"," ").split():
                              parts=token.split(",")
                              if len(parts)>=2:
                                  try:
                                      lon=float(parts[0]); lat=float(parts[1])
                                      ele=float(parts[2]) if len(parts)>2 and parts[2] not in ("","0","0.0") else None
                                      pts.append((lat,lon,ele))
                                  except: pass
                      elif el.tag.endswith("coord") and el.text:
                          parts=el.text.split()
                          if len(parts)>=2:
                              try:
                                  lon=float(parts[0]); lat=float(parts[1])
                                  ele=float(parts[2]) if len(parts)>2 and parts[2] not in ("","0","0.0") else None
                                  pts.append((lat,lon,ele))
                              except: pass
              # Deduplicate adjacent points, since KML may repeat same LineString elsewhere.
              out=[]
              for p in pts:
                  if not out or (p[0],p[1]) != (out[-1][0],out[-1][1]):
                      out.append(p)
              return out

          def hav(a,b):
              R=6371008.8
              la1=math.radians(a[0]); la2=math.radians(b[0])
              dla=la2-la1; dlo=math.radians(b[1]-a[1])
              q=math.sin(dla/2)**2+math.cos(la1)*math.cos(la2)*math.sin(dlo/2)**2
              return 2*R*math.asin(math.sqrt(q))

          def route_len(pts):
              return sum(hav(a,b) for a,b in zip(pts,pts[1:]))/1000 if len(pts)>1 else 0

          def nearest_stats(a,b):
              # point-to-point diagnostic; dense route sources make this useful for detecting route changes
              if not a or not b: return None
              lat0=sum(p[0] for p in a+b)/(len(a)+len(b))
              sx=111320*math.cos(math.radians(lat0)); sy=110540
              cell=100.0
              grid={}
              for p in b:
                  x=p[1]*sx; y=p[0]*sy
                  grid.setdefault((math.floor(x/cell),math.floor(y/cell)),[]).append((x,y))
              ds=[]
              for p in a:
                  x=p[1]*sx; y=p[0]*sy; ix=math.floor(x/cell); iy=math.floor(y/cell)
                  best=1e30
                  for dx in range(-5,6):
                      for dy in range(-5,6):
                          for qx,qy in grid.get((ix+dx,iy+dy),()):
                              best=min(best,math.hypot(x-qx,y-qy))
                  ds.append(best)
              ds.sort()
              def pct(q): return ds[min(len(ds)-1,math.floor(q*(len(ds)-1)))]
              return {
                  "n":len(a),"median_m":round(pct(.5),2),"p90_m":round(pct(.9),2),"p95_m":round(pct(.95),2),
                  "within20_pct":round(100*sum(x<=20 for x in ds)/len(ds),2),
                  "within50_pct":round(100*sum(x<=50 for x in ds)/len(ds),2),
                  "within100_pct":round(100*sum(x<=100 for x in ds)/len(ds),2)
              }

          report={"local_comparisons":{}, "plotaroute":{}, "itra":{}, "vasahistorier":{}}

          # Local official-source comparison.
          local={}
          for key,path,kind in [
              ("uv45_2026_official_kmz","source/UV45_20260610.kmz","kmz"),
              ("uv90_2026_official_kmz","source/UV-90_20260610.kmz","kmz"),
              ("uv45_2026_trace","data/routes/vasaloppet-ultravasan-2026-ultravasan-45.gpx","gpx"),
              ("uv45_2024_itra","source/routes/ultravasan45-2024-itra-267130.gpx","gpx"),
              ("uv90_2024_local","data/routes/vasaloppet-ultravasan-2024-ultravasan-90.gpx","gpx"),
              ("uv90_2022_local","data/routes/Ultravasan 90 2022.gpx","gpx"),
              ("uv90_old_plotaroute_copy","source/Ultravasan90-2014-2022.gpx","gpx"),
          ]:
              p=Path(path)
              pts=parse_kmz(p) if kind=="kmz" else parse_gpx(p)
              local[key]=pts
              report["local_comparisons"][key]={
                  "path":path,"points":len(pts),"distance_km":round(route_len(pts),3),
                  "elevation_points":sum(x[2] is not None for x in pts),
                  "start":list(pts[0][:2]) if pts else None,"finish":list(pts[-1][:2]) if pts else None
              }
          for left,right in [
              ("uv45_2026_official_kmz","uv45_2026_trace"),
              ("uv45_2026_official_kmz","uv45_2024_itra"),
              ("uv45_2024_itra","uv45_2026_trace"),
              ("uv90_2026_official_kmz","uv90_2024_local"),
              ("uv90_2022_local","uv90_old_plotaroute_copy"),
          ]:
              report["local_comparisons"][f"{left}__vs__{right}"]=nearest_stats(local[left],local[right])
          # Save exact official 2026 KMZ geometry as candidate GPX text so it can be inspected later.
          for family,key in [("uv45","uv45_2026_official_kmz"),("uv90","uv90_2026_official_kmz")]:
              pts=local[key]
              g=ET.Element("gpx",{"version":"1.1","creator":"Ultravasan route source research","xmlns":"http://www.topografix.com/GPX/1/1"})
              md=ET.SubElement(g,"metadata"); ET.SubElement(md,"name").text=f"{family} 2026 official KMZ geometry"
              trk=ET.SubElement(g,"trk"); seg=ET.SubElement(trk,"trkseg")
              for lat,lon,ele in pts:
                  tp=ET.SubElement(seg,"trkpt",{"lat":f"{lat:.8f}","lon":f"{lon:.8f}"})
                  if ele is not None: ET.SubElement(tp,"ele").text=f"{ele:.2f}"
              ET.ElementTree(g).write(OUT/f"{family}-2026-official-kmz.gpx",encoding="utf-8",xml_declaration=True)

          # Plotaroute public pages: inspect only public responses and linked URLs/snippets.
          plot_ids=[2311120,2311944,2311126,2311089,2356968,1942022,2710347]
          for rid in plot_ids:
              url=f"https://www.plotaroute.com/route/{rid}"
              res=fetch(url); body=res["body"]; text_body=body.decode("utf-8","replace")
              (OUT/f"plotaroute-{rid}.html").write_bytes(body)
              urls=set()
              for m in re.finditer(r'''(?:href|action)\s*=\s*["']([^"']+)["']''', text_body, re.I):
                  u=htmlmod.unescape(m.group(1))
                  if any(tok in u.lower() for tok in ("gpx","download","route")):
                      urls.add(urljoin(url,u))
              snippets=[]
              for line in text_body.splitlines():
                  low=line.lower()
                  if ("gpx" in low or "download" in low) and len(snippets)<20:
                      snippets.append(re.sub(r"\s+"," ",line.strip())[:600])
              report["plotaroute"][str(rid)]={
                  "status":res["status"],"content_type":res["content_type"],"final_url":res["final_url"],
                  "sha256":hashlib.sha256(body).hexdigest() if body else None,
                  "linked_candidates":sorted(urls)[:30],"download_snippets":snippets
              }

          # ITRA: inspect known detail/course pages and discover any Trace de Trail URLs/IDs.
          race_ids={
              "uv45-2016":11020,"uv90-2016":11021,
              "uv45-2017":19323,"uv90-2017":19321,
              "uv90-2022":77493,"uv45-2022":77494,
              "uv90-2023":84082,"uv45-2023":84083,
          }
          for race_key,rid in race_ids.items():
              row={}
              for typ in ("RaceDetails","RaceCourse"):
                  if typ=="RaceDetails":
                      url=f"https://itra.run/Races/{typ}/{rid}"
                  else:
                      distance="45.Km" if "uv45" in race_key else "90.Km"
                      year=race_key[-4:]
                      url=f"https://itra.run/Races/{typ}/{distance}/{year}/{rid}"
                  res=fetch(url); body=res["body"]; txt=body.decode("utf-8","replace")
                  trace_urls=sorted(set(re.findall(r'https?://(?:www\.)?tracedetrail\.fr/(?:en|fr)/trace/\d+',txt,re.I)))
                  trace_ids=sorted(set(int(x) for x in re.findall(r'tracedetrail[^0-9]{0,100}(\d{4,8})',txt,re.I)))
                  hrefs=sorted(set(urljoin(url,htmlmod.unescape(x)) for x in re.findall(r'''href\s*=\s*["']([^"']+)["']''',txt,re.I) if "trace" in x.lower()))
                  row[typ]={"status":res["status"],"content_type":res["content_type"],"final_url":res["final_url"],"trace_urls":trace_urls,"trace_ids":trace_ids[:30],"trace_hrefs":hrefs[:30],"bytes":len(body)}
                  (OUT/f"itra-{race_key}-{typ}.html").write_bytes(body)
              report["itra"][race_key]=row

          # Inspect 2015 race-year page for race IDs and all-edition metadata.
          for name,url in [
              ("2015-raceyear","https://itra.run/Races/RaceResults?raceYearId=8385"),
              ("2023-detail","https://itra.run/Races/RaceDetails/84083"),
          ]:
              res=fetch(url); txt=res["body"].decode("utf-8","replace")
              ids=sorted(set(int(x) for x in re.findall(r'/Races/(?:RaceDetails|RaceCourse|RaceResults)/[^"\'<> ]*?/?(\d{3,8})(?:["\'/?#]|$)',txt)))
              report["itra"][name]={"status":res["status"],"race_ids":ids[:100],"bytes":len(res["body"])}

          # Vasahistorier: look only through public page-linked resources for GPX references.
          vh="https://vasahistorier.se/ask/banan/ultravasan"
          res=fetch(vh); txt=res["body"].decode("utf-8","replace")
          links=sorted(set(urljoin(vh,htmlmod.unescape(x)) for x in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',txt,re.I)))
          gpx_links=[x for x in links if ".gpx" in x.lower()]
          resource_findings=[]
          for u in links:
              if not any(tok in u.lower() for tok in (".js","ultravasan","gpx")): continue
              if urlparse(u).netloc not in {"vasahistorier.se","www.vasahistorier.se"}: continue
              rr=fetch(u); tt=rr["body"].decode("utf-8","replace")
              hits=sorted(set(re.findall(r'''[^"'\s<>]{0,100}\.gpx(?:\?[^"'\s<>]*)?''',tt,re.I)))
              if hits:
                  resource_findings.append({"url":u,"status":rr["status"],"gpx_hits":hits[:30]})
          report["vasahistorier"]={
              "status":res["status"],"content_type":res["content_type"],"linked_gpx":gpx_links,
              "linked_resources_checked":len([u for u in links if any(tok in u.lower() for tok in (".js","ultravasan","gpx"))]),
              "resource_findings":resource_findings,
              "page_sha256":hashlib.sha256(res["body"]).hexdigest() if res["body"] else None
          }

          (OUT/"research.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("ROUTE_SOURCE_RESEARCH_BEGIN")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print("ROUTE_SOURCE_RESEARCH_END")
          PY
      - name: Fetch public Plotaroute client scripts
        shell: bash
        run: |
          curl -fsSL -A 'Mozilla/5.0 (compatible; UltravasanRouteAudit/1.0)' https://www.plotaroute.com/js/Route_1.41.js -o tmp/route-source-research/Route_1.41.js
          curl -fsSL -A 'Mozilla/5.0 (compatible; UltravasanRouteAudit/1.0)' https://www.plotaroute.com/js/Route_Plugins_1.6.js -o tmp/route-source-research/Route_Plugins_1.6.js
          grep -Ein 'GPX|download|DownloadFormats|DL_Format' tmp/route-source-research/Route_1.41.js | head -80 > tmp/route-source-research/plotaroute-download-js.txt || true
      - name: Pack repository snapshot
        shell: bash
        run: |
          zip -qr "$RUNNER_TEMP/repo-snapshot.zip" . -x '.git/*' 'tmp/*'
      - uses: actions/upload-artifact@v4
        with:
          name: route-source-research
          path: tmp/route-source-research
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot
          path: ${{ runner.temp }}/repo-snapshot.zip
          retention-days: 3
