name: Temporary fetch UV45 GPX candidates

on:
  push:
    branches:
      - feature/year-specific-gpx-routes

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/year-specific-gpx-routes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public Trace de Trail geometry
        run: |
          python tools/download_trace_de_trail_routes.py --refresh --delay 1 --ids 51603 75784
          mkdir -p source/routes
          cp tmp/route-candidates/tracedetrail/ultravasan45-2018-trace-51603.gpx source/routes/ultravasan45-2018-itra-51603.gpx
          cp tmp/route-candidates/tracedetrail/ultravasan45-2019-trace-75784.gpx source/routes/ultravasan45-2019-itra-75784.gpx
      - name: Commit fetched source files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fetch-uv45-gpx.yml
          git add source/routes/ultravasan45-2018-itra-51603.gpx source/routes/ultravasan45-2019-itra-75784.gpx
          git commit -m "Add UV45 2018 and 2019 route source GPX"
          git push origin HEAD:feature/year-specific-gpx-routes
