name: Finalize verified annual routes

on:
  push:
    branches:
      - route-finalize-staging

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: route-finalize-staging
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install -r requirements-browser.txt

      - name: Apply reviewed final route patch
        shell: bash
        run: |
          set -euo pipefail
          patch -p2 < .route-finalize/final.patch
          git diff --check

      - name: Regenerate route and contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_routes.py
          python tools/race_contracts.py
          python tools/u20_route_audit.py
          git diff --check

      - name: Verify protected baseline and release gates
        shell: bash
        run: |
          set -euo pipefail
          if [ -f reports/U2_BASELINE.json ]; then
            python tools/u2_baseline.py --check
          else
            python tools/u0_baseline.py --check
          fi
          python tools/race_contracts.py --check --base-ref origin/main
          python tools/u3_modularize.py             --source docs/data/ultravasan.json             --output-dir "$RUNNER_TEMP/u3-data"             --write --check             --report "$RUNNER_TEMP/u3-modular-report.json"
          python tools/u9_release_audit.py             --modular-report "$RUNNER_TEMP/u3-modular-report.json"             --json-output "$RUNNER_TEMP/u9-release-audit.json"

      - name: Run all Python tests
        run: python -m pytest -q

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find docs/assets tests tools -type f \( -name "*.js" -o -name "*.mjs" \) | sort)

      - name: Run all JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node "$file"
          done < <(find tests -maxdepth 1 -type f -name "test_*.js" | sort)

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Prepare browser data
        shell: bash
        run: |
          set -euo pipefail
          python tools/u3_modularize.py             --source docs/data/ultravasan.json             --output-dir docs/data             --write --check             --report "$RUNNER_TEMP/u3-browser-data.json"

      - name: Run Chromium smoke and Playwright E2E
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory docs >"$RUNNER_TEMP/ultravasan-http.log" 2>&1 &
          browser_path="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          "$browser_path"             --headless             --no-sandbox             --disable-gpu             --remote-debugging-port=9223             --user-data-dir="$RUNNER_TEMP/ultravasan-chromium"             http://127.0.0.1:8765/ >"$RUNNER_TEMP/ultravasan-browser.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null
          node tools/verify_local_browser.mjs
          python tools/verify_playwright_e2e.py --base-url http://127.0.0.1:8765/

      - name: Stage only reviewed deliverables
        shell: bash
        run: |
          set -euo pipefail
          git show origin/feature/year-specific-gpx-routes:.github/workflows/test.yml > .github/workflows/test.yml
          git rm -f .github/workflows/tmp-finalize-routes.yml
          git rm -f .github/workflows/tmp-route-source-research.yml || true
          git rm -rf .route-finalize

          git add             .github/workflows/test.yml             config/edition_routes.json             tools/build_routes.py             tools/race_contracts.py             tools/u20_route_audit.py             docs/assets/course-intelligence.js             docs/assets/map.js             tools/verify_local_browser.mjs             tests/test_build_routes.py             tests/test_course_intelligence.js             tests/test_dynamic_2026_frontend.js             tests/test_map.js             tests/test_race_contracts.js             tests/test_runner_replay.js             tests/test_u20_route_audit.py             data/routes/ultravasan90-routes.json             docs/data/ultravasan-routes.js             docs/data/race-catalog.json             docs/data/race-catalog.js             reports/U20_ROUTE_AUDIT.json             reports/U20_ROUTE_AUDIT.md

          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          if printf '%s\n' "$staged" | grep -Eq '^(data/ultravasan\.sqlite|docs/data/ultravasan\.json|docs/data/ultravasan-data\.js|data/.*/?(results|splits)|docs/data/.*/?(results|splits))'; then
            echo "Protected result/split/database file staged unexpectedly" >&2
            exit 1
          fi
          git diff --cached --check
          test -n "$staged"

      - name: Commit finalized staging tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize verified annual route geometry"
          git push origin HEAD:route-finalize-staging
