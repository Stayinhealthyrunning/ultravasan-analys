name: Temporary regenerate GPX routes

on:
  push:
    branches:
      - feature/year-specific-gpx-routes

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/year-specific-gpx-routes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate route registry and audit
        run: |
          python tools/build_routes.py
          python tools/u20_route_audit.py
      - name: Run focused regression tests
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest -q tests/test_build_routes.py tests/test_u20_route_audit.py tests/test_trace_route_download.py
          git diff --check
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-regenerate-gpx-routes.yml
          git add data/routes/ultravasan90-routes.json docs/data/ultravasan-routes.js reports/U20_ROUTE_AUDIT.json reports/U20_ROUTE_AUDIT.md
          git commit -m "Regenerate annual route registry with donor elevations"
          git push origin HEAD:feature/year-specific-gpx-routes
