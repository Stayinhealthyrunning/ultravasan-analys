name: U4 bootstrap vendored Leaflet

on:
  push:
    branches:
      - feature/u4-vendored-leaflet-map-engine
    paths:
      - ".github/workflows/u4-bootstrap-leaflet.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/u4-vendored-leaflet-map-engine
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Hämta och verifiera Leaflet 1.9.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/leaflet" docs/vendor/leaflet-1.9.4
          mkdir -p "$RUNNER_TEMP/leaflet" docs/vendor/leaflet-1.9.4/images
          (
            cd "$RUNNER_TEMP/leaflet"
            npm pack leaflet@1.9.4 --silent
            tar -xzf leaflet-1.9.4.tgz
          )

          src="$RUNNER_TEMP/leaflet/package"
          js_hash="sha256-$(openssl dgst -sha256 -binary "$src/dist/leaflet.js" | openssl base64 -A)"
          css_hash="sha256-$(openssl dgst -sha256 -binary "$src/dist/leaflet.css" | openssl base64 -A)"
          test "$js_hash" = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          test "$css_hash" = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="

          cp "$src/dist/leaflet.js" docs/vendor/leaflet-1.9.4/leaflet.js
          cp "$src/dist/leaflet.css" docs/vendor/leaflet-1.9.4/leaflet.css
          cp "$src/dist/images/layers.png" docs/vendor/leaflet-1.9.4/images/layers.png
          cp "$src/dist/images/layers-2x.png" docs/vendor/leaflet-1.9.4/images/layers-2x.png
          cp "$src/dist/images/marker-icon.png" docs/vendor/leaflet-1.9.4/images/marker-icon.png
          cp "$src/dist/images/marker-icon-2x.png" docs/vendor/leaflet-1.9.4/images/marker-icon-2x.png
          cp "$src/dist/images/marker-shadow.png" docs/vendor/leaflet-1.9.4/images/marker-shadow.png
          cp "$src/LICENSE" docs/vendor/leaflet-1.9.4/LICENSE

          printf '%s\n'             'Leaflet 1.9.4'             'Source package: npm leaflet@1.9.4'             "leaflet.js SRI: $js_hash"             "leaflet.css SRI: $css_hash"             > docs/vendor/leaflet-1.9.4/VENDOR_INFO.txt

      - name: Spara verifierade vendor-filer på feature-branchen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vendor/leaflet-1.9.4
          git diff --cached --quiet && exit 0
          git commit -m "U4.7: vendor verified Leaflet 1.9.4 assets"
          git push origin HEAD:feature/u4-vendored-leaflet-map-engine
