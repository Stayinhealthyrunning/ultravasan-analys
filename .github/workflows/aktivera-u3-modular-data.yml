name: Aktivera U3 modulär data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Jag vill aktivera modulär/lazy webbdata på main"
        required: true
        default: false
        type: boolean
      confirmation_text:
        description: "Skriv exakt: ACTIVATE-U3-MODULAR-DATA"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ultravasan-u3-modular-data
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Hämta main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installera testberoenden
        run: python -m pip install -r requirements-test.txt

      - name: Säkerhetsgrind före aktivering
        shell: bash
        env:
          CONFIRMATION_TEXT: ${{ inputs.confirmation_text }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION_TEXT" = "ACTIVATE-U3-MODULAR-DATA"
          test "$(git branch --show-current)" = "main"
          git diff --quiet
          python tools/u2_baseline.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("docs/data/ultravasan-data-catalog.js")
          text=path.read_text(encoding="utf-8").strip()
          prefix="window.ULTRAVASAN_DATA_CATALOG="
          if not text.startswith(prefix) or not text.endswith(";"):
              raise SystemExit("Ogiltig U3-katalogbootstrap")
          catalog=json.loads(text[len(prefix):-1])
          if catalog.get("mode")!="legacy":
              raise SystemExit("U3 modulär data verkar redan vara aktiverad")
          PY

      - name: Skapa återställningspunkt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BACKUP_TAG="backup-before-u3-modular-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$BACKUP_TAG" "$GITHUB_SHA" -m "Återställningspunkt före U3 modulär data"
          git push origin "$BACKUP_TAG"
          echo "BACKUP_TAG=$BACKUP_TAG" >> "$GITHUB_ENV"

      - name: Bygg modulära datafiler från verifierad monolit
        shell: bash
        run: |
          set -euo pipefail
          python tools/u3_modularize.py \
            --source docs/data/ultravasan.json \
            --output-dir docs/data \
            --write --check \
            --report reports/U3_MODULAR_DATA_APPLIED.json
          python tools/u2_baseline.py --check

      - name: Kör regressionssviten i modulärt läge
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          while IFS= read -r file; do
            node --check "$file"
          done < <(find docs/assets tests tools -type f \( -name "*.js" -o -name "*.mjs" \) | sort)
          node --check docs/data/ultravasan-data-catalog.js
          node --check docs/data/ultravasan-uv90.js
          node --check docs/data/ultravasan-uv45.js
          while IFS= read -r file; do
            node --check "$file"
          done < <(find docs/data -maxdepth 1 -type f -name "ultravasan-edition-*.js" | sort)
          while IFS= read -r file; do
            node "$file"
          done < <(find tests -maxdepth 1 -type f -name "test_*.js" | sort)
          git diff --check

      - name: Installera Chromium
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Verifiera verkligt modulärt browserflöde
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory docs >"$RUNNER_TEMP/ultravasan-http.log" 2>&1 &
          browser_path="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          "$browser_path" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --remote-debugging-port=9223 \
            --user-data-dir="$RUNNER_TEMP/ultravasan-chromium" \
            http://127.0.0.1:8765/ >"$RUNNER_TEMP/ultravasan-browser.log" 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9223/json/version >/dev/null
          node tools/verify_local_browser.mjs

      - name: Kontrollera exakt ändringsyta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          required={
              "docs/data/ultravasan-data-catalog.js",
              "docs/data/ultravasan-data-catalog.json",
              "docs/data/ultravasan-uv90.json",
              "docs/data/ultravasan-uv90.js",
              "docs/data/ultravasan-uv45.json",
              "docs/data/ultravasan-uv45.js",
              "reports/U3_MODULAR_DATA_APPLIED.json",
          }
          changed={
              line[3:]
              for line in subprocess.check_output(["git","status","--porcelain"],text=True).splitlines()
              if line.strip()
          }
          edition_files={
              path for path in changed
              if path.startswith("docs/data/ultravasan-edition-")
              and (path.endswith(".json") or path.endswith(".js"))
          }
          unexpected=sorted(changed-required-edition_files)
          missing=sorted(required-changed)
          edition_json={path for path in edition_files if path.endswith(".json")}
          edition_js={path for path in edition_files if path.endswith(".js")}
          if len(edition_json)!=22 or len(edition_js)!=22:
              raise SystemExit(
                  f"Expected 22 edition JSON + 22 edition JS files, got "
                  f"{len(edition_json)} JSON and {len(edition_js)} JS"
              )
          if unexpected or missing:
              raise SystemExit(f"Unexpected U3 diff. unexpected={unexpected}, missing={missing}")
          print("U3 diff is restricted to catalog, family chunks, 22 edition pairs and report.")
          PY

      - name: Spara aktiveringen på main
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/data/ultravasan-data-catalog.js \
            docs/data/ultravasan-data-catalog.json \
            docs/data/ultravasan-uv90.json \
            docs/data/ultravasan-uv90.js \
            docs/data/ultravasan-uv45.json \
            docs/data/ultravasan-uv45.js \
            docs/data/ultravasan-edition-*.json \
            docs/data/ultravasan-edition-*.js \
            reports/U3_MODULAR_DATA_APPLIED.json
          git commit -m "Activate U3 modular browser data"
          git push origin HEAD:main

      - name: Sammanfattning
        if: always()
        shell: bash
        run: |
          {
            echo "## U3 modulär webbdata"
            echo ""
            echo "- Återställningspunkt: \`${BACKUP_TAG:-inte skapad}\`"
            echo "- Legacy-monoliten behålls oförändrad som paritetskälla och fallback."
            echo "- Startsidan laddar efter aktivering endast vald loppfamiljs data."
            echo "- Delade kartlänkar laddar endast de RaceEdition-chunks som valda result-ID:n tillhör."
          } >> "$GITHUB_STEP_SUMMARY"
