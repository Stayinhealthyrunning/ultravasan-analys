name: Enrich UV90 2025 sprint auxiliary data

on:
  push:
    branches:
      - hotfix/spurtvinnaren-year-switch

permissions:
  contents: write

concurrency:
  group: uv90-2025-sprint-enrichment-v3
  cancel-in-progress: true

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/spurtvinnaren-year-switch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Hämta sista officiella kontrollen efter Eldris för UV90 2025
        run: |
          python tools/import_sprint_auxiliary.py \
            --race ultravasan90-2025 \
            --output-db "$RUNNER_TEMP/ultravasan-sprint.sqlite" \
            --raw "$RUNNER_TEMP/sprint-raw" \
            --report "$RUNNER_TEMP/sprint-report.json" \
            --delay 0.5 \
            --workers 2 \
            --min-exact 1000
          cp "$RUNNER_TEMP/ultravasan-sprint.sqlite" data/ultravasan.sqlite
          cp "$RUNNER_TEMP/sprint-report.json" reports/UV90_2025_SPRINT_ENRICHMENT.json
      - name: Bygg webbdata och modulära filer
        run: |
          python tools/uvtool.py validate
          python tools/uvtool.py export
          python tools/u3_modularize.py --source docs/data/ultravasan.json --output-dir docs/data --write --check --report reports/U3_MODULAR_DATA_APPLIED.json
      - name: Verifiera att endast sprint-auxiliary har ändrats
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import u2_baseline

          report=json.loads(Path("reports/UV90_2025_SPRINT_ENRICHMENT.json").read_text(encoding="utf-8"))
          old=json.loads(Path("reports/U2_BASELINE.json").read_text(encoding="utf-8"))
          new=u2_baseline.build_snapshot()

          assert report["race_key"]=="ultravasan90-2025"
          assert report["auxiliary_only"] is True
          assert report["inserted_or_updated"]==1519, report
          assert report["exact_finished"]==1519, report
          assert report["errors"]==0, report
          assert report["sex_counts"]=={"F":441,"M":1078}, report
          assert report["non_aux_splits_before"]==report["non_aux_splits_after"]==14521, report

          assert new["totals"]["results"]==old["totals"]["results"]==24422
          assert new["totals"]["splits"]==old["totals"]["splits"]+1519==141429
          assert new["source_results"]==old["source_results"]
          assert new["identity_state"]==old["identity_state"]
          assert new["identity_evidence_distribution"]==old["identity_evidence_distribution"]

          protected_unchanged=(
            "results_count",
            "external_ids_count",
            "result_payload_digest",
            "external_id_values_digest",
            "source_records_digest",
          )
          for key in protected_unchanged:
              assert new["protected_payload"][key]==old["protected_payload"][key], key
          assert new["protected_payload"]["splits_count"]==old["protected_payload"]["splits_count"]+1519
          assert new["protected_payload"]["split_digest"]!=old["protected_payload"]["split_digest"]

          for key in ("athletes","external_ids","person_keys","identity_evidence","pending_review_candidates"):
              assert new["totals"][key]==old["totals"][key], key

          print("Verified auxiliary-only baseline migration:", report["inserted_or_updated"], "new exact sprint splits")
          PY
      - name: Flytta verifierad post-release-baseline
        run: |
          python tools/u2_baseline.py --write
          python tools/u2_baseline.py --check
      - name: Kontrollera U9 direkt efter baselineflytt
        run: |
          python tools/u9_release_audit.py --modular-report reports/U3_MODULAR_DATA_APPLIED.json
      - name: Identifiera eventuell testskrivning i standarddatabasen
        run: |
          BEFORE="$(sha256sum data/ultravasan.sqlite | cut -d' ' -f1)"
          for file in $(find tests -maxdepth 1 -type f -name 'test_*.py' | sort); do
            python -m pytest -q "$file"
            AFTER="$(sha256sum data/ultravasan.sqlite | cut -d' ' -f1)"
            if [ "$AFTER" != "$BEFORE" ]; then
              echo "DATABASE_MUTATED_BY=$file"
              echo "before=$BEFORE"
              echo "after=$AFTER"
              exit 3
            fi
          done
      - name: Kör regressionssvit före publicering
        run: |
          python -m pytest -q
          while IFS= read -r file; do node "$file"; done < <(find tests -maxdepth 1 -type f -name "test_*.js" | sort)
          git diff --check
      - name: Spara endast verifierad enrichment på PR-branchen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/enrich-uv90-2025-sprint.yml
          git add -f \
            config/races.json \
            data/ultravasan.sqlite \
            docs/data \
            reports/UV90_2025_SPRINT_ENRICHMENT.json \
            reports/U3_MODULAR_DATA_APPLIED.json \
            reports/U2_BASELINE.json \
            config/release_freeze.json \
            tools/u2_baseline.py \
            reports/U9_RELEASE_FREEZE.md
          git diff --cached --check
          git commit -m "Enrich UV90 2025 final control for Spurtvinnaren"
          git push origin HEAD:hotfix/spurtvinnaren-year-switch
